<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOX MUSIC — Playlist</title>
  <link rel="icon" type="image/jpeg" href="Image/Logo.jpg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="boxie.css">
</head>
<body class="bg-black text-white vh-100 d-flex flex-column overflow-hidden app-shell">

  <div class="container py-4 py-md-5 col-lg-10 flex-grow-1 overflow-auto album-page">
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-3">
      <div>
        <h1 id="playlistName" class="h3 text-white fw-bold">Loading…</h1>
        <p id="playlistDesc" class="text-secondary mb-1"></p>
        <p id="playlistTrackCount" class="text-secondary small mb-0"></p>
      </div>
      <a href="../main.html" class="btn btn-outline-success rounded-pill fw-semibold">
        <i class="fa-solid fa-arrow-left me-2"></i>Back to Library
      </a>
    </div>

    <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 g-3" id="playlistGrid">
      <div id="playlistEmpty" class="alert alert-dark border-secondary text-secondary d-none" role="alert">
        No tracks in this album yet.
      </div>
    </div>
  </div>

  <!-- Player Bar is injected by player.js (shared across all pages) -->
  <script src="../player.js"></script>

  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const nameEl = document.getElementById('playlistName');
      const descEl = document.getElementById('playlistDesc');
      const grid = document.getElementById('playlistGrid');
      const emptyEl = document.getElementById('playlistEmpty');
      const trackCountEl = document.getElementById('playlistTrackCount');

      function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, (character) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[character]));
      }

      function resolveUrl(url) {
        if (!url) return url;
        return /^https?:\/\//i.test(url) ? url : encodeURI(url);
      }

      // Same visual card as the main page (cover art + title + artist/album).
      function trackCardHtml(track, index) {
        return `
          <div class="col">
            <div class="card card-track h-100 p-2 border-0 rounded-3 text-white" role="button"
                 tabindex="0" onclick="playAlbumTrack(${index})"
                 onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();playAlbumTrack(${index});}"
                 aria-label="Play ${escapeHtml(track.title)}">
              <img src="${resolveUrl(track.coverArtUrl) || 'Image/Logo.jpg'}" class="card-img-top rounded mb-2" alt="${escapeHtml(track.title)}" loading="lazy">
              <div class="card-body p-0 text-truncate">
                <h6 class="card-title text-truncate mb-1 fw-bold fs-6">${escapeHtml(track.title)}</h6>
                <p class="card-text text-secondary text-truncate style-subtext mb-0">${escapeHtml(track.artist)}</p>
                <p class="card-text text-secondary text-truncate style-subtext mb-0">${escapeHtml(track.album || '')}${track.genre ? ` • ${escapeHtml(track.genre)}` : ''}</p>
              </div>
            </div>
          </div>
        `;
      }

      // Exposed for the card onclick: load the whole album into the shared player.
      window.playAlbumTrack = function (index) {
        if (window.MusicPlayer) window.MusicPlayer.playIndex(index);
      };

      if (!id) {
        grid.innerHTML = '<p class="text-secondary">No album selected.</p>';
        return;
      }

      fetch(`http://localhost:3000/api/playlists/${encodeURIComponent(id)}`)
        .then((res) => {
          if (!res.ok) throw new Error(`API ${res.status}`);
          return res.json();
        })
        .then((pl) => {
          nameEl.textContent = pl.name || 'Untitled Album';
          descEl.textContent = pl.description || '';
          document.title = `${pl.name || 'Album'} — Box Music`;

          const list = pl.tracks || [];
          if (trackCountEl) {
            trackCountEl.textContent = list.length
              ? `${list.length} ${list.length === 1 ? 'track' : 'tracks'}`
              : '';
          }

          if (list.length) {
            emptyEl.classList.add('d-none');
            grid.innerHTML = list.map((t, i) => trackCardHtml(t, i)).join('');
            if (window.MusicPlayer) window.MusicPlayer.setQueue(list, 0);
          } else {
            emptyEl.classList.remove('d-none');
            grid.innerHTML = '';
            if (window.MusicPlayer) window.MusicPlayer.setQueue([], 0);
          }
        })
        .catch((err) => {
          console.error('Failed to load album:', err);
          emptyEl.textContent = 'Failed to load album.';
          emptyEl.classList.remove('d-none');
          grid.innerHTML = '';
        });
    })();
  </script>
</body>

</html>
