<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="Image/Logo.jpg">
  <title>Music_online Project</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-black text-white vh-100 d-flex flex-column overflow-hidden">

  <div class="container-fluid flex-grow-1 overflow-hidden p-0">
    <div class="row h-100 g-0">
      
      <!-- Sidebar (desktop only — hidden on mobile, replaced by mobile-topbar below) -->
      <aside class="col-md-3 col-lg-2 bg-dark p-3 d-none d-md-flex flex-column gap-4 border-end border-secondary border-opacity-25">
        <div class="d-flex align-items-center gap-2 fs-4 fw-bold text-success">
          <img src="Image/Logo.jpg" alt="Logo" class="app-logo">
          <span class="text-white">BOX MUSIC</span>
        </div>
        <nav class="nav nav-pills flex-column gap-2">
          <a class="nav-link active bg-success text-white fw-bold d-flex align-items-center gap-3" href="#">
            <i class="fa-solid fa-house"></i> Home
          </a>
          <a class="nav-link text-secondary fw-semibold d-flex align-items-center gap-3" href="#">
            <i class="fa-solid fa-magnifying-glass"></i> Search
          </a>
          <a class="nav-link text-secondary fw-semibold d-flex align-items-center gap-3" href="#">
            <i class="fa-solid fa-book"></i> Your Library
          </a>
        </nav>
      </aside>

      <!-- Main Content -->
      <main class="col-12 col-md-9 col-lg-10 p-3 p-md-4 overflow-auto bg-gradient-dark app-main">
        <!-- Mobile top bar (logo + auth) — only visible on <md -->
        <div class="d-flex d-md-none align-items-center justify-content-between gap-2 mb-3 mobile-topbar">
          <div class="d-flex align-items-center gap-2 fw-bold">
            <img src="Image/Logo.jpg" alt="Logo" class="app-logo app-logo-sm">
            <span class="text-white small">BOX MUSIC</span>
          </div>
          <div class="mobile-auth d-flex align-items-center gap-2"></div>
        </div>
        <div class="d-flex align-items-center justify-content-between gap-3 mb-4 main-toolbar flex-wrap">
          <div class="input-group rounded-pill overflow-hidden style-search" style="max-width: 350px;">
            <span class="input-group-text bg-dark border-0 text-secondary"><i class="fa-solid fa-magnifying-glass"></i></span>
            <input type="text" id="searchInput" class="form-control bg-dark border-0 text-white shadow-none" placeholder="What do you want to play?">
          </div>
          <div id="authControls" class="d-flex align-items-center gap-2">
            <a href="verify/register.html" class="btn btn-outline-light rounded-pill fw-semibold">Register</a>
            <a href="verify/login.html" class="btn btn-success rounded-pill fw-semibold">Login</a>
          </div>
        </div>

        <section class="mb-4">
          <div class="d-flex align-items-center justify-content-between mb-3">
            <h2 class="h4 fw-bold mb-0"><i class="fa-solid fa-fire text-success me-2"></i>Popular Tracks</h2>
            <small id="popularHint" class="text-secondary style-subtext"></small>
          </div>
          <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 g-3" id="popularGrid"></div>
        </section>

        <section class="mb-4">
          <div class="d-flex align-items-center justify-content-between mb-3">
            <h2 class="h4 fw-bold mb-0"><i class="fa-solid fa-wand-magic-sparkles text-success me-2"></i>Recommended For You</h2>
          </div>
          <p id="recommendReason" class="text-secondary style-subtext mt-n2 mb-3"></p>
          <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 g-3" id="recommendGrid"></div>
        </section>

        <section>
          <div class="d-flex align-items-center justify-content-between mb-3">
            <h2 class="h4 fw-bold mb-0">All Tracks</h2>
            <small id="allTracksCount" class="text-secondary style-subtext"></small>
          </div>
          <div id="allTracksEmpty" class="alert alert-dark border-secondary text-secondary d-none" role="alert">
            No tracks in database. Run <code>node config/seed.js</code> to seed from <code>config/seed.js</code>.
          </div>
          <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 g-3" id="trackGrid"></div>
        </section>
      </main>

    </div>
  </div>

  <!-- Player Bar -->
  <footer class="bg-dark text-white border-top border-secondary border-opacity-25 px-3 py-2 d-flex align-items-center justify-content-between gap-2 player-bar" style="min-height: 90px;">

    <!-- Now Playing -->
    <div class="d-flex align-items-center gap-3 player-track" style="width: 25%;">
      <img id="playerCover" src="https://picsum.photos/seed/placeholder/60/60" class="rounded player-cover" width="56" height="56" alt="Cover">
      <div class="text-truncate player-meta">
        <div id="playerTitle" class="fw-semibold text-truncate small">Select Track</div>
        <div id="playerArtist" class="text-secondary text-truncate style-subtext"></div>
      </div>
    </div>

    <!-- Player Controls -->
    <div class="d-flex flex-column align-items-center gap-1 player-controls" style="width: 50%; max-width: 600px;">
      <div class="d-flex align-items-center gap-3 player-buttons">
        <button id="prevSongBtn" title="Previous song" class="btn btn-link text-secondary p-0 border-0 player-extra"><i class="fa-solid fa-backward fs-5"></i></button>
        <button id="prevBtn" title="Step backward" class="btn btn-link text-secondary p-0 border-0"><i class="fa-solid fa-backward-step fs-5"></i></button>
        <button id="playBtn" class="btn btn-light rounded-circle p-0 d-flex align-items-center justify-content-center player-play" style="width: 36px; height: 36px;"><i class="fa-solid fa-play text-dark"></i></button>
        <button id="nextBtn" title="Step forward" class="btn btn-link text-secondary p-0 border-0"><i class="fa-solid fa-forward-step fs-5"></i></button>
        <button id="nextSongBtn" title="Next song" class="btn btn-link text-secondary p-0 border-0 player-extra"><i class="fa-solid fa-forward fs-5"></i></button>
      </div>
      <div class="d-flex align-items-center gap-2 w-100 text-secondary style-subtext player-seek">
        <span id="currTime">0:00</span>
        <input type="range" class="form-range flex-grow-1 style-range" id="seekSlider" value="0" min="0" max="100">
        <span id="totalTime">0:00</span>
      </div>
    </div>

    <!-- Volume -->
    <div class="d-flex align-items-center gap-2 justify-content-end text-secondary player-volume" style="width: 25%;">
      <i class="fa-solid fa-volume-high"></i>
      <input type="range" class="form-range style-range" id="volumeSlider" value="80" min="0" max="100" style="max-width: 100px;">
    </div>

  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
