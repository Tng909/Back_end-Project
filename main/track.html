<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="Image/Logo.jpg">
  <title>Track details - Box Music</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="boxie.css">
</head>
<body class="bg-black text-white min-vh-100">
  <main class="container py-4 py-md-5 track-detail-page">
    <a href="Main.html" class="btn btn-outline-light rounded-pill mb-4">
      <i class="fa-solid fa-arrow-left me-2"></i>Back to music
    </a>

    <p id="trackLoading" class="text-secondary" role="status">Loading track...</p>
    <div id="trackError" class="alert alert-danger d-none" role="alert"></div>

    <article id="trackDetail" class="d-none">
      <section class="track-detail-hero rounded-4 p-4 p-md-5 mb-4">
        <div class="row align-items-center g-4">
          <div class="col-12 col-md-5 col-lg-4">
            <img id="detailCover" class="track-detail-cover rounded-3 shadow" alt="">
          </div>
          <div class="col-12 col-md-7 col-lg-8">
            <p class="text-uppercase text-info small fw-bold mb-2">Track details</p>
            <h1 id="detailTitle" class="display-5 fw-bold text-break"></h1>
            <p id="detailArtist" class="fs-4 text-secondary mb-4"></p>
            <dl class="row track-metadata mb-4">
              <dt class="col-sm-3">Producer</dt><dd id="detailProducer" class="col-sm-9"></dd>
              <dt class="col-sm-3">Album</dt><dd id="detailAlbum" class="col-sm-9"></dd>
              <dt class="col-sm-3">Genre</dt><dd id="detailGenre" class="col-sm-9"></dd>
            </dl>
            <button id="detailPlayButton" class="btn btn-success rounded-pill px-4 fw-bold" type="button">
              <i class="fa-solid fa-play me-2"></i>Play track
            </button>
          </div>
        </div>
      </section>

      <section class="track-player-panel rounded-4 p-3 p-md-4 mb-4" aria-label="Track player">
        <p class="text-secondary small mb-0">
          <i class="fa-solid fa-circle-info text-info me-2"></i>
          Playback, seek, volume, shuffle and repeat are controlled by the shared player bar at the bottom of the page.
        </p>
      </section>

      <section class="track-lyrics-panel rounded-4 p-4 p-md-5">
        <h2 class="h4 fw-bold mb-3"><i class="fa-solid fa-align-left text-info me-2"></i>Lyrics</h2>
        <p id="lyricsHint" class="text-secondary small"></p>
        <div id="detailLyrics" class="track-lyrics" aria-live="polite"></div>
      </section>
    </article>
  </main>

  <!-- BOXIE AI POPUP MESSENGER -->
  <button id="boxieFab" class="boxie-fab" type="button" aria-label="Chat with Boxie AI" aria-expanded="false">
    <i class="fa-solid fa-robot" aria-hidden="true"></i>
    <span id="boxiePing" class="boxie-ping d-none"></span>
  </button>
  <section id="boxiePanel" class="boxie-panel d-none" aria-label="Boxie AI chat" role="dialog" aria-modal="false">
    <header class="boxie-head">
      <div class="boxie-identity">
        <span class="boxie-avatar"><i class="fa-solid fa-robot"></i></span>
        <div>
          <strong>Boxie AI</strong>
          <small id="boxieStatus" class="boxie-status"><span class="boxie-dot"></span>online</small>
        </div>
      </div>
      <div class="d-flex gap-1">
        <button id="boxieClear" class="boxie-icon-btn" type="button" title="Clear chat"><i class="fa-solid fa-trash-can"></i></button>
        <button id="boxieClose" class="boxie-icon-btn" type="button" title="Close chat"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </header>
    <div id="boxieMsgs" class="boxie-msgs" aria-live="polite"></div>
    <div id="boxieChips" class="boxie-chips"></div>
    <form id="boxieForm" class="boxie-form" autocomplete="off">
      <input id="boxieInput" class="boxie-input" type="text" maxlength="1000" placeholder="Ask Boxie..." aria-label="Message Boxie">
      <button class="boxie-send" type="submit" aria-label="Send"><i class="fa-solid fa-paper-plane"></i></button>
    </form>
  </section>

  <script src="player.js"></script>
  <script src="track-detail.js"></script>
  <script src="boxie.js?v=20261020-2"></script>
</body>
</html>
