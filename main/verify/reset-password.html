<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Spotify</title>
  <link rel="icon" type="image/jpeg" href="../Image/Logo.jpg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body class="bg-black text-white vh-100 d-flex align-items-center justify-content-center">

  <div class="card bg-dark text-white p-4 shadow-lg rounded-4 auth-card">
    <h3 class="text-center fw-bold text-success mb-3">Reset Password</h3>

    <div id="alertBox" class="alert alert-danger py-2 small d-none" role="alert"></div>

    <form id="resetForm">
      <div class="mb-2">
        <label class="form-label small text-secondary">Username or Email</label>
        <input type="text" id="resetIdentifier" class="form-control bg-secondary text-white border-0 shadow-none" required>
      </div>
      <div class="mb-2">
        <label class="form-label small text-secondary">New Password</label>
        <input type="password" id="resetPassword" class="form-control bg-secondary text-white border-0 shadow-none" required>
      </div>
      <div class="mb-3">
        <label class="form-label small text-secondary">Confirm New Password</label>
        <input type="password" id="resetConfirmPassword" class="form-control bg-secondary text-white border-0 shadow-none" required>
      </div>
      <button type="submit" class="btn btn-success w-100 fw-bold mb-3">Update Password</button>
    </form>

    <div class="text-center">
      <a href="login.html" class="text-secondary text-decoration-none small">Back to Login</a>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
