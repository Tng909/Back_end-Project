<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm Email (optional) - Box Music</title>
  <link rel="icon" type="image/jpeg" href="../Image/Logo.jpg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body class="bg-black text-white vh-100 d-flex align-items-center justify-content-center">
  <main class="card bg-dark text-white p-4 shadow-lg rounded-4 auth-card text-center">
    <h3 class="fw-bold text-success mb-3">Verify your account</h3>
    <p class="small text-secondary mb-3">Click the <b>Verify My Account</b> button in your email (expires in 20 minutes).</p>
    <p id="verificationMessage" class="text-secondary mb-3" role="status" aria-live="polite">Confirming your email...</p>
    <a id="loginLink" href="login.html" class="btn btn-success fw-bold d-none">Go to Login</a>
  </main>
  <script>
    (async () => {
      const message = document.getElementById('verificationMessage');
      const loginLink = document.getElementById('loginLink');
      const showLogin = () => loginLink.classList.remove('d-none');
      const token = new URLSearchParams(window.location.search).get('token');
      window.history.replaceState({}, document.title, window.location.pathname);
      if (!token) {
        message.textContent = 'No verification token found. Check your email for the Verify My Account button.';
        showLogin();
        return;
      }
      try {
        const response = await fetch(`${window.location.origin}/api/auth/confirm-email`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Email confirmation failed.');
        message.textContent = data.message;
        showLogin();
      } catch (error) {
        message.textContent = `${error.message}`;
        showLogin();
      }
    })();
  </script>
</body>
</html>
