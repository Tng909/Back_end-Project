<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Spotify</title>
  <link rel="icon" type="image/jpeg" href="../Image/Logo.jpg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body class="bg-black text-white vh-100 d-flex align-items-center justify-content-center">

  <div class="card bg-dark text-white p-4 shadow-lg rounded-4 auth-card">
    <h3 class="text-center fw-bold text-success mb-3">Register</h3>

    <div id="alertBox" class="alert alert-danger py-2 small d-none" role="alert"></div>

    <form id="regForm">
      <div class="mb-2">
        <label class="form-label small text-secondary mb-1">Full Name</label>
        <input type="text" id="regFullName" class="form-control bg-secondary text-white border-0 shadow-none" required>
      </div>
      <div class="mb-2">
        <label class="form-label small text-secondary mb-1">Username</label>
        <input type="text" id="regUsername" class="form-control bg-secondary text-white border-0 shadow-none" required>
      </div>
      <div class="mb-2">
        <label class="form-label small text-secondary mb-1">Email Address</label>
        <input type="email" id="regEmail" class="form-control bg-secondary text-white border-0 shadow-none" required>
      </div>
      <div class="mb-2">
        <label class="form-label small text-secondary mb-1">Phone Number</label>
        <input type="tel" id="regPhone" class="form-control bg-secondary text-white border-0 shadow-none" required>
      </div>
      <div class="mb-2">
        <label class="form-label small text-secondary mb-1">Password</label>
        <input type="password" id="regPassword" class="form-control bg-secondary text-white border-0 shadow-none" required>
      </div>
      <div class="mb-2">
        <label class="form-label small text-secondary mb-1">Confirm Password</label>
        <input type="password" id="regConfirmPassword" class="form-control bg-secondary text-white border-0 shadow-none" required>
      </div>
      <button type="submit" id="sendOtpBtn" class="btn btn-success w-100 fw-bold mb-2">Send OTP</button>
      <div id="otpSection" class="d-none">
        <label class="form-label small text-secondary mb-1">6-digit OTP code</label>
        <div class="input-group mb-2">
          <input type="text" id="regOtp" inputmode="numeric" maxlength="6" placeholder="Enter OTP"
            class="form-control bg-secondary text-white border-0 shadow-none text-center fw-bold" style="letter-spacing: 6px;">
          <button type="button" id="resendOtpBtn" class="btn btn-outline-light btn-sm">Resend</button>
        </div>
        <button type="button" id="verifyOtpBtn" class="btn btn-success w-100 fw-bold mb-3">Verify & Register</button>
      </div>
    </form>

    <div class="text-center">
      <a href="login.html" class="text-secondary text-decoration-none small">Already have an account? Login</a>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
