<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Manager - Spotify</title>
  <link rel="icon" type="image/jpeg" href="../Image/Logo.jpg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../style.css">
</head>
<body class="bg-black text-white min-vh-100 d-flex flex-column">

  <!-- Top bar (same look as Main) -->
  <header class="bg-dark border-bottom border-secondary border-opacity-25 px-4 py-3 d-flex align-items-center justify-content-between">
    <div class="d-flex align-items-center gap-2 fs-5 fw-bold">
      <img src="../Image/Logo.jpg" alt="Logo" class="app-logo app-logo-sm">
      <span class="text-white">BOX MUSIC</span>
    </div>
    <a href="../Main.html" class="btn btn-outline-light btn-sm rounded-pill fw-semibold">
      <i class="fa-solid fa-house me-1"></i> Back to Home
    </a>
  </header>

  <main class="flex-grow-1 d-flex align-items-start justify-content-center p-4">
    <div class="card bg-dark text-white p-4 shadow-lg rounded-4 account-card w-100">

      <div class="d-flex align-items-center gap-3 mb-1">
        <div class="account-avatar d-flex align-items-center justify-content-center fw-bold fs-4" id="avatarCircle">?</div>
        <div>
          <h3 class="fw-bold mb-0">Account Manager</h3>
          <small class="text-secondary style-subtext" id="accountSub">View and update your profile</small>
        </div>
      </div>

      <hr class="border-secondary border-opacity-25">

      <div id="alertBox" class="alert py-2 small d-none" role="alert"></div>

      <div id="loadingBox" class="text-center text-secondary py-4">
        <div class="spinner-border spinner-border-sm text-success" role="status"></div>
        <span class="ms-2 small">Loading profile...</span>
      </div>

      <form id="profileForm" class="d-none" novalidate>
        <div class="mb-3">
          <label class="form-label small text-secondary mb-1" for="fullNameInput">Full Name</label>
          <input type="text" id="fullNameInput" class="form-control bg-secondary text-white border-0 shadow-none" required>
        </div>
        <div class="mb-3">
          <label class="form-label small text-secondary mb-1" for="usernameInput">Username</label>
          <input type="text" id="usernameInput" class="form-control bg-secondary text-white border-0 shadow-none" required>
        </div>
        <div class="mb-3">
          <label class="form-label small text-secondary mb-1" for="emailInput">Email</label>
          <input type="email" id="emailInput" class="form-control bg-secondary text-white border-0 shadow-none" required>
          <div class="form-text text-secondary style-subtext">Changing email keeps you logged in with the new address.</div>
        </div>
        <div class="mb-4">
          <label class="form-label small text-secondary mb-1" for="phoneInput">Phone Number</label>
          <input type="tel" id="phoneInput" class="form-control bg-secondary text-white border-0 shadow-none" required>
        </div>

        <div class="d-flex gap-2 justify-content-end">
          <button type="button" id="cancelBtn" class="btn btn-outline-light rounded-pill fw-semibold px-4">
            <i class="fa-solid fa-rotate-left me-1"></i> Cancel
          </button>
          <button type="submit" id="submitBtn" class="btn btn-success rounded-pill fw-bold px-4" disabled>
            <i class="fa-solid fa-check me-1"></i> Save Changes
          </button>
        </div>
      </form>
    </div>
  </main>

  <!-- Success popup modal -->
  <div class="modal fade" id="successModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content bg-dark text-white text-center p-4 rounded-4 border border-success border-opacity-50">
        <div class="success-check mx-auto mb-3 d-flex align-items-center justify-content-center">
          <i class="fa-solid fa-check fs-3 text-success"></i>
        </div>
        <h5 class="fw-bold mb-1">Profile updated!</h5>
        <p class="text-secondary small mb-3">Your changes were saved successfully.</p>
        <button type="button" class="btn btn-success rounded-pill fw-bold w-100" data-bs-dismiss="modal">OK</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="user_manage.js"></script>
</body>
</html>
