<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="Image/Logo.jpg">
  <title>404 — Không tìm thấy trang | BOX MUSIC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .error-code {
      font-size: clamp(5rem, 18vw, 10rem);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, var(--neon-blue), var(--neon-cyan));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 24px var(--neon-blue-dim));
    }
    .error-card { max-width: 520px; width: 100%; }
    .error-path {
      word-break: break-all;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 0.85rem;
    }
  </style>
</head>
<body class="bg-black text-white vh-100 d-flex align-items-center justify-content-center">
  <main class="card bg-dark text-white p-4 p-md-5 shadow-lg rounded-4 error-card text-center mx-3">
    <div class="error-code" aria-hidden="true">404</div>
    <h1 class="h4 fw-bold mt-2 mb-2">Không tìm thấy trang</h1>
    <p class="text-secondary small mb-1">Đường dẫn bạn truy cập không tồn tại hoặc đã bị di chuyển.</p>
    <p class="text-secondary small mb-3">The page you are looking for does not exist or was moved.</p>
    <p id="errorPath" class="error-path text-warning bg-black rounded-3 px-3 py-2 d-none"></p>
    <div class="d-flex flex-column flex-sm-row gap-2 justify-content-center mt-3">
      <a href="/" class="btn btn-success fw-bold"><i class="fa-solid fa-house me-2"></i>Về trang chủ</a>
      <button type="button" class="btn btn-outline-secondary fw-bold" onclick="history.back()">
        <i class="fa-solid fa-arrow-left me-2"></i>Quay lại
      </button>
    </div>
    <div class="mt-3">
      <a href="/verify/login.html" class="text-secondary text-decoration-none small">Đi tới đăng nhập</a>
    </div>
  </main>
  <script>
    // Hiển thị đường dẫn lỗi (chỉ render text, tránh XSS qua URL)
    (function () {
      var el = document.getElementById('errorPath');
      var badPath = window.location.pathname + window.location.search;
      if (badPath && badPath !== '/') {
        el.textContent = badPath;
        el.classList.remove('d-none');
      }
    })();
  </script>
</body>
</html>
