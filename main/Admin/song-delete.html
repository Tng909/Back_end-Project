<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delete song - music_Online Admin</title>
    <link rel="stylesheet" href="admin.css">
    <style>
        .topbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
        .del-card { max-width: 560px; border-top: 4px solid var(--acc); }
        .del-title { color: var(--acc); }
        .mini { display: flex; gap: 12px; align-items: center; margin: 12px 0; }
        .mini img { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; background: var(--line); }
        #delMsg { min-height: 1.4em; }
    </style>
</head>
<body>
    <div class="app">
        <aside>
            <div class="logo">music<b>_</b>Online</div>
            <nav>
                <a href="Admin_dashbroad.html#songs">Songs</a>
                <a href="Admin_dashbroad.html#users">Users</a>
            </nav>
            <a class="side-home" href="../Main.html">Main page</a>
        </aside>
        <main>
            <div class="topbar">
                <a class="btn" id="backBtn" href="Admin_dashbroad.html#songs">Back to Songs</a>
            </div>
            <section class="panel" style="display:block">
                <h1 class="del-title">Delete song?</h1>
                <p class="sub">This cannot be undone. Confirm to permanently delete.</p>
                <div class="wrap del-card" style="padding:22px">
                    <div class="mini">
                        <img id="delCover" src="" alt="">
                        <div><div class="t" id="delName">Loading...</div><div class="m" id="delSub"></div></div>
                    </div>
                    <p class="m" id="delMsg" role="alert"></p>
                    <div class="foot">
                        <a class="btn" id="cancelBtn" href="Admin_dashbroad.html#songs">Cancel</a>
                        <button class="btn p" id="confirmDelBtn" type="button">Yes, delete</button>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="song-delete.js"></script>
</body>
</html>
