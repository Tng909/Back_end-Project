<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/jpeg" href="../Image/Logo.jpg">
    <title>music_Online Admin</title>
    <link rel="stylesheet" href="admin.css">
</head>

<body>
    <div class="app">

        <aside>
            <div class="logo">music<b>_</b>Online</div>
            <nav>
                <a href="#songs" class="nav-songs">Songs</a>
                <a href="#users" class="nav-users">Users</a>
            </nav>
            <a class="side-home" href="../Main.html">← Main page</a>
        </aside>

        <main>

            <!-- SONGS -->
            <section id="songs" class="panel">
                <h1>Songs</h1>
                <p class="sub">Manage music info.</p>
                <form class="bar" id="songFilterBar">
                    <input type="search" id="songSearchInput" placeholder="Search songs" aria-label="Search songs">
                    <select id="songGenreFilter" aria-label="Filter by genre">
                        <option value="">All genres</option>
                    </select>
                    <button class="btn" type="submit">Search</button>
                    <a class="btn p" href="song-add.html">Add song</a>
                </form>

                <div class="wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Cover</th>
                                <th>Title</th>
                                <th>Album</th>
                                <th>Genre</th>
                                <th>Audio</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="songsBody">
                            <tr><td colspan="6" class="m">Loading songs from database…</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- USERS -->
            <section id="users" class="panel">
                <h1>Users</h1>
                <p class="sub">Manage user accounts.</p>
                <form class="bar" id="userFilterBar">
                    <input type="search" id="userSearchInput" placeholder="Search users" aria-label="Search users">
                    <select id="userRoleFilter" aria-label="Filter by role">
                        <option value="">All roles</option>
                        <option value="user">user</option>
                        <option value="admin">admin</option>
                    </select>
                    <button class="btn" type="submit">Search</button>
                    <a class="btn p" href="user-add.html">Add user</a>
                </form>

                <div class="wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Full name</th>
                                <th>Username</th>
                                <th>Phone</th>
                                <th>Email</th>
                                <th>Password</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersBody">
                            <tr><td colspan="6" class="m">Loading users from database…</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>

        </main>
    </div>

    <script src="admin.js"></script>

</body>

</html>
