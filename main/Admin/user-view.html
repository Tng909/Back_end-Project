<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/jpeg" href="../Image/Logo.jpg">
    <title>User details - music_Online Admin</title>
    <link rel="stylesheet" href="admin.css">
    <style>
        .kv { display: grid; grid-template-columns: 170px 1fr; gap: 8px 12px; margin: 14px 0; }
        .kv dt { color: var(--mute); font-size: 13px; }
        .kv dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
        .ava-big { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; background: var(--line); display: block; }
        .topbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
        .topbar .spacer { flex: 1; }
        .urow { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
    </style>
</head>
<body>
    <div class="app">
        <aside>
            <div class="logo">music<b>_</b>Online</div>
            <nav>
                <a href="Admin_dashbroad.html#songs">Songs</a>
                <a href="Admin_dashbroad.html#users">Users</a>
            </nav>
            <a class="side-home" href="../Main.html">Main page</a>
        </aside>
        <main>
            <div class="topbar">
                <a class="btn" href="Admin_dashbroad.html#users">Back to Users</a>
                <span class="spacer"></span>
                <a class="btn" id="editLink" href="#">Edit</a>
                <a class="btn d" id="deleteLink" href="#">Delete</a>
            </div>
            <section class="panel" style="display:block">
                <h1 id="userTitle">Loading user...</h1>
                <p class="sub" id="userSub">Fetching details from database.</p>
                <div class="wrap" style="padding:22px">
                    <div class="urow">
                        <img class="ava-big" id="userAvatar" src="" alt="Avatar">
                        <div><span class="tag" id="f-role">-</span></div>
                    </div>
                    <dl class="kv">
                        <dt>Full name</dt><dd id="f-name">-</dd>
                        <dt>Username</dt><dd id="f-username">-</dd>
                        <dt>Email</dt><dd id="f-email">-</dd>
                        <dt>Phone</dt><dd id="f-phone">-</dd>
                        <dt>Verified</dt><dd id="f-verified">-</dd>
                        <dt>Email confirmed</dt><dd id="f-confirmed">-</dd>
                        <dt>User ID</dt><dd class="m" id="f-id">-</dd>
                        <dt>Created</dt><dd class="m" id="f-created">-</dd>
                        <dt>Updated</dt><dd class="m" id="f-updated">-</dd>
                    </dl>
                    <p class="m">Password is bcrypt-hashed and never exposed by the API.</p>
                </div>
            </section>
        </main>
    </div>
    <script src="user-view.js"></script>
</body>
</html>
